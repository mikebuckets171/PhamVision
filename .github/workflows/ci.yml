name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    # Releases are built on macos-26; macos-15 checks the code still builds
    # and passes with Xcode 16's older Swift.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
