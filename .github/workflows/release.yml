name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Package and publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test
      - name: Package
        run: scripts/package.sh "${GITHUB_REF_NAME#v}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/PhamVision-${GITHUB_REF_NAME#v}.zip" \
            --title "PhamVision ${GITHUB_REF_NAME}" --notes-file CHANGELOG.md --verify-tag
