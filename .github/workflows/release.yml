name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Package and publish
    # Same Swift generation the app is developed and tested with. Xcode 16's
    # Swift 6.1 handles some callbacks differently at runtime (that's what
    # crashed 0.2.0), so a release built there can behave unlike what was tested.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test
      - name: Package
        run: scripts/package.sh "${GITHUB_REF_NAME#v}"
      - name: Sign the update and write the update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="dist/PhamVision-${VERSION}.zip"
          KEY="$RUNNER_TEMP/sparkle_key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY"
          SIGNED=$(.build/artifacts/sparkle/Sparkle/bin/sign_update --ed-key-file "$KEY" "$ZIP")
          rm -f "$KEY"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/PhamVision-${VERSION}.zip"
          python3 scripts/make-appcast.py "$VERSION" "$URL" "$SIGNED" > dist/appcast.xml
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/PhamVision-${GITHUB_REF_NAME#v}.zip" dist/appcast.xml \
            --title "PhamVision ${GITHUB_REF_NAME}" --notes-file CHANGELOG.md --verify-tag
